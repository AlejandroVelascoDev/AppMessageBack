services:
  postgres:
    image: postgres:15-alpine
    container_name: mobile_app_db
    environment:
      POSTGRES_DB: mobile_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobile_app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mobile_app_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mobile_app_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-rQaRsXGZDvo9KNFbca2mVRBXyTrUoXHGWXVruFxd3rJOXVig+nrwjAyC4q75pU11h9CxemhfhU/HtjCj6tiUmg==}
      JWT_EXPIRATION: 86400000
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
